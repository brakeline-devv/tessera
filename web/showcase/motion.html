<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embers</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0604; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let speed = reduce.matches ? 0.35 : 1;
  reduce.addEventListener?.('change', e => { speed = e.matches ? 0.35 : 1; });

  let W = 0, H = 0, DPR = 1;
  const bg = document.createElement('canvas');
  const bgx = bg.getContext('2d');

  // Glow sprite
  const SPR = 64;
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = SPR;
  (() => {
    const s = sprite.getContext('2d');
    const g = s.createRadialGradient(SPR/2, SPR/2, 0, SPR/2, SPR/2, SPR/2);
    g.addColorStop(0.00, 'rgba(255,240,200,1)');
    g.addColorStop(0.08, 'rgba(255,200,110,0.95)');
    g.addColorStop(0.22, 'rgba(255,130,40,0.45)');
    g.addColorStop(0.50, 'rgba(220,70,15,0.12)');
    g.addColorStop(1.00, 'rgba(150,30,0,0)');
    s.fillStyle = g;
    s.fillRect(0, 0, SPR, SPR);
  })();

  function paintBackground() {
    bg.width = canvas.width; bg.height = canvas.height;
    const w = bg.width, h = bg.height;
    const g = bgx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0a0403');
    g.addColorStop(0.55, '#160805');
    g.addColorStop(1, '#2a0e05');
    bgx.fillStyle = g;
    bgx.fillRect(0, 0, w, h);
    const r = bgx.createRadialGradient(w*0.5, h*1.05, 0, w*0.5, h*1.05, Math.max(w, h)*0.8);
    r.addColorStop(0, 'rgba(120,40,10,0.45)');
    r.addColorStop(0.5, 'rgba(60,18,6,0.18)');
    r.addColorStop(1, 'rgba(0,0,0,0)');
    bgx.fillStyle = r;
    bgx.fillRect(0, 0, w, h);
    // vignette
    const v = bgx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.55)');
    bgx.fillStyle = v;
    bgx.fillRect(0, 0, w, h);
  }

  let embers = [];
  function makeEmber(initial) {
    const depth = Math.random();           // 0 far, 1 near
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H * 1.1 : H + 20 + Math.random() * 60,
      vx: 0,
      vy: -(14 + depth * 34 + Math.random() * 10),
      size: 1.2 + depth * 3.2 + Math.random() * 1.2,
      depth,
      life: initial ? Math.random() : 0,
      maxLife: 9 + Math.random() * 12,
      phase: Math.random() * Math.PI * 2,
      flick: 2 + Math.random() * 5,
      sway: 0.3 + Math.random() * 0.9,
      heat: 0.6 + Math.random() * 0.4
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    paintBackground();
    const target = Math.min(260, Math.max(60, Math.floor(W * H / 7000)));
    while (embers.length < target) embers.push(makeEmber(true));
    embers.length = target;
  }
  window.addEventListener('resize', resize);
  resize();

  const ptr = { x: W/2, y: H/2, tx: W/2, ty: H/2, active: 0, target: 0 };
  window.addEventListener('pointermove', e => { ptr.tx = e.clientX; ptr.ty = e.clientY; ptr.target = 1; });
  window.addEventListener('pointerdown', e => { ptr.tx = e.clientX; ptr.ty = e.clientY; ptr.target = 1; });
  document.addEventListener('pointerleave', () => { ptr.target = 0; });
  window.addEventListener('blur', () => { ptr.target = 0; });

  let last = performance.now(), t = 0;
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    dt *= speed;
    t += dt;

    ptr.x += (ptr.tx - ptr.x) * Math.min(1, dt * 3 / speed * speed + 0.02);
    ptr.y += (ptr.ty - ptr.y) * Math.min(1, dt * 3 + 0.02);
    ptr.active += (ptr.target - ptr.active) * Math.min(1, dt * 1.5 + 0.01);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'lighter';

    // breathing ground glow
    const pulse = 0.75 + 0.25 * Math.sin(t * 0.6) * Math.sin(t * 0.37 + 1);
    const gg = ctx.createRadialGradient(W/2, H + H*0.15, 0, W/2, H + H*0.15, H * 0.75);
    gg.addColorStop(0, `rgba(255,110,30,${0.16 * pulse})`);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);

    const reach = Math.max(W, H) * 0.6;
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life += dt / e.maxLife;

      // gentle turbulent sway
      const wind = Math.sin(t * 0.25 + e.y * 0.004) * 6 + Math.sin(t * e.sway + e.phase + e.y * 0.012) * 10 * e.sway;
      let ax = (wind - e.vx) * 0.8;

      // lean toward pointer
      if (ptr.active > 0.01) {
        const dx = ptr.x - e.x, dy = ptr.y - e.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 1;
        const fall = Math.max(0, 1 - d / reach);
        ax += (dx / d) * 60 * fall * fall * ptr.active * (0.5 + e.depth * 0.6);
        e.vy += (dy / d) * 8 * fall * ptr.active * dt;
      }
      e.vx += ax * dt;
      const baseVy = -(14 + e.depth * 34);
      e.vy += (baseVy - e.vy) * 0.4 * dt;

      e.x += e.vx * dt;
      e.y += e.vy * dt;

      if (e.life >= 1 || e.y < -40 || e.x < -60 || e.x > W + 60) {
        embers[i] = makeEmber(false);
        continue;
      }

      const fadeIn = Math.min(1, e.life * 6);
      const fadeOut = Math.min(1, (1 - e.life) * 2.5);
      const fl = 0.7 + 0.3 * Math.sin(t * e.flick + e.phase) * Math.sin(t * e.flick * 0.53 + e.phase * 2);
      const heightFade = Math.min(1, 0.35 + e.y / H);
      const a = fadeIn * fadeOut * fl * heightFade * e.heat * (0.45 + e.depth * 0.55);
      if (a <= 0.01) continue;

      const s = e.size * (5 + 2 * fl) * (1 - e.life * 0.35);
      ctx.globalAlpha = a;
      ctx.drawImage(sprite, e.x - s/2, e.y - s/2, s, s);
      // faint tail
      ctx.globalAlpha = a * 0.35;
      const s2 = s * 0.7;
      ctx.drawImage(sprite, e.x - e.vx * 0.08 - s2/2, e.y - e.vy * 0.08 - s2/2, s2, s2);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
